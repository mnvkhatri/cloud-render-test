name: Cloud Video Render Test

on:
  workflow_dispatch:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg & Devanagari Hindi Font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p ~/.local/share/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf" -o ~/.local/share/fonts/NotoSansDevanagari.ttf
          fc-cache -f ~/.local/share/fonts

      - name: Install Python Libraries & Playwright Browsers
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Cloud Video Render
        run: |
          python render.py

      - name: Upload Finished MP4 Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-Video
          path: render_action_test.mp4
          retention-days: 7
