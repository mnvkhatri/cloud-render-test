name: Cloud Video Render

on:
  workflow_dispatch:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sacred Cinema Cloud Video Render
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python render.py

      - name: Create GitHub Release with Video & Thumb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-$(date +%s)"
          gh release create "$TAG" render_action_test.mp4 thumb.jpg \
            --title "Render $TAG" \
            --notes "Topic: ${{ github.event.client_payload.topic }}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Finished MP4 Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-Video
          path: render_action_test.mp4
          retention-days: 7
